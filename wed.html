<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ColombiaAnt - Publicidad</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* BANNER SUPERIOR */
        .banner-superior {
            width: 100%;
            min-height: 100px;
            background-color: #151515;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .banner-superior img {
            display: block;
            width: 100%;
            max-height: 180px;
            object-fit: contain;
        }

        /* CONTENIDO CENTRAL */
        .contenido {
            width: 100%;
            padding: 10px;
            background-color: #000000;
        }

        .pagina-web {
            width: 100%;
            height: 75vh;
            min-height: 400px;
            border: 1px solid #333333;
            background-color: white;
        }

        .pagina-web iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* BANNER INFERIOR */
        .banner-inferior {
            width: 100%;
            min-height: 100px;
            background-color: #151515;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .banner-inferior img {
            display: block;
            width: 100%;
            max-height: 180px;
            object-fit: contain;
        }

        .texto-banner {
            color: #aaaaaa;
            text-align: center;
            padding: 25px 10px;
        }

        @media (max-width: 600px) {
            .pagina-web {
                height: 75vh;
                min-height: 350px;
            }

            .banner-superior,
            .banner-inferior {
                min-height: 80px;
            }
        }
    </style>
</head>

<body>

    <!-- BANNER PUBLICITARIO SUPERIOR -->
    <header class="banner-superior">
        <a href="#" target="_blank">
            <img src="banner-superior.jpg"
                 alt="Publicidad superior"
                 onerror="this.style.display='none'">
        </a>
        <div class="texto-banner">
            Banner publicitario superior
        </div>
    </header>
        <!-- PÁGINA WEB CENTRAL -->
    <main style="background:#000;padding 10px;
        text-align:center;">
<iframe
    src="https://www.profitableratecpmnetwork.com/qyuzwmmbm?key=3b0d02df84e8d62e5f125d8d748f952c"
    title="Página web central"
    style="width:100%; height:75vh; border:0;
    backgronund:#fff;
    allowfullscreen>
</iframe>

<!-- ENLACE PARA ABRIR LA PÁGINA -->
   <p>         
<a href="https://www.profitableratecpmnetwork.com/qyuzwmmbm?key=3b0d02df84e8d62e5f125d8d748f952c"
   target="_blank"
   rel="noopener noreferrer">
    Gana con Solo registrarte
  </a>
</p>
            </main>
        </div>
    </main>

    <!-- BANNER PUBLICITARIO INFERIOR -->
    <footer class="banner-inferior">
        <a href="#" target="_blank">
            <img src="banner-inferior.jpg"
                 alt="Publicidad inferior"
                 onerror="this.style.display='none'">
        </a>
        <div class="texto-banner">
            Banner publicitario inferior
        </div>
    </footer>

</body>
</html>
