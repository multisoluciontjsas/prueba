<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro Optimizado</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 20px;
        }

        /* Estilos para los bloques de anuncios */
        .ad-space {
            background-color: #fcf8e3;
            border: 2px dashed #fbeed5;
            color: #c09853;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .ad-space.middle {
            margin: 25px 0;
            background-color: #d9edf7;
            border-color: #bce8f1;
            color: #3a87ad;
        }

        .ad-space.footer-ad {
            margin-top: 20px;
            margin-bottom: 0;
            background-color: #f5f5f5;
            border-color: #ddd;
            color: #777;
        }

        /* Estilos del Formulario */
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 15px;
        }

        .form-group.full-width {
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #3498db;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #27ae60;
        }

        /* Ajuste responsivo para campos juntos */
        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
       <!-- 1. ANUNCIO EN EL ENCABEZADO -->
        <div class="ad-container header-ad">
            <script>
              atOptions = {
                'key' : '67facd5dae3141d3a5a72c7684741c7a',
                'format' : 'iframe',
                'height' : 60,
                'width' : 468,
                'params' : {}
              };
            </script>
            <script src="https://www.highrevenueformat.com/67facd5dae3141d3a5a72c7684741c7a/invoke.js">
                
            </script>
        </div>

        <h2>Regístrate</h2>

        <form action="#" method="POST">
            
            <!-- Bloque 1: Cuenta, Nombre y Correo -->
            <div class="form-group full-width">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="form-group full-width">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="juan@ejemplo.com" required>
            </div>

            <!-- 2. ANUNCIO EN LA MITAD -->
        <div class="ad-container header-ad">
            <script>
              atOptions = {
                'key' : '67facd5dae3141d3a5a72c7684741c7a',
                'format' : 'iframe',
                'height' : 60,
                'width' : 468,
                'params' : {}
              };
            </script>
            <script src="https://www.highrevenueformat.com/67facd5dae3141d3a5a72c7684741c7a/invoke.js">
                
            </script>
        </div>

            <!-- Bloque 2: Ubicación (País, Estado, Municipio) en una sola fila para ahorrar espacio -->
            <div class="form-row">
                <div class="form-group">
                    <label for="pais">País</label>
                    <input type="text" id="pais" name="pais" placeholder="Tu país" required>
                </div>
                
                <div class="form-group">
                    <label for="estado">Estado / Prov.</label>
                    <input type="text" id="estado" name="estado" placeholder="Tu estado" required>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="municipio">Municipio / Ciudad</label>
                <input type="text" id="municipio" name="municipio" placeholder="Tu municipio" required>
            </div>

            <!-- Bloque 3: Teléfono -->
            <div class="form-group full-width">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej. +1 234 567 890" required>
            </div>

            <!-- Botón Registrarse -->
            <button type="submit" class="btn-submit">Registrar</button>
        </form>

        <!-- 3. ANUNCIO EN EL PIE DE PÁGINA -->
        <div class="ad-container header-ad">
            <script>
              atOptions = {
                'key' : '67facd5dae3141d3a5a72c7684741c7a',
                'format' : 'iframe',
                'height' : 60,
                'width' : 468,
                'params' : {}
              };
            </script>
            <script src="https://www.highrevenueformat.com/67facd5dae3141d3a5a72c7684741c7a/invoke.js">
                
            </script>
        </div>

    </div>

</body>
</html>
