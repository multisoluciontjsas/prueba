<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 20px;
        }

        /* Contenedores optimizados para banners de 468x60 */
        .ad-container {
            width: 468px;
            height: 60px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f9f9f9;
            border: 1px dashed #ccc;
            overflow: hidden;
        }

        .ad-container.middle {
            margin: 25px auto;
        }

        .ad-container.footer-ad {
            margin: 20px auto 0 auto;
        }

        /* Estilos del Formulario */
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 15px;
        }

        .form-group.full-width {
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #3498db;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #27ae60;
        }

        /* Ajuste responsivo por si la pantalla es más pequeña que el banner */
        @media (max-width: 500px) {
            .ad-container {
                width: 100%;
                max-width: 468px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        
        <!-- 1. ANUNCIO EN EL ENCABEZADO -->
        <div class="ad-space header-ad">
            <script>
              atOptions = {
                'key' : '67facd5dae3141d3a5a72c7684741c7a',
                'format' : 'iframe',
                'height' : 60,
                'width' : 468,
                'params' : {}
              };
            </script>
            <script src="https://highrevenueformat.com"></script>
        </div>

        <h2>Regístrate</h2>

        <form action="#" method="POST">
            
            <!-- Campos Iniciales -->
            <div class="form-group full-width">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="form-group full-width">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="juan@ejemplo.com" required>
            </div>

            <!-- 2. ANUNCIO EN LA MITAD -->
            <div class="ad-space middle">
                <script>
                  atOptions = {
                    'key' : '67facd5dae3141d3a5a72c7684741c7a',
                    'format' : 'iframe',
                    'height' : 60,
                    'width' : 468,
                    'params' : {}
                  };
                </script>
                <script src="https://highrevenueformat.com"></script>
            </div>

            <!-- Campos de Ubicación -->
            <div class="form-row">
                <div class="form-group">
                    <label for="pais">País</label>
                    <input type="text" id="pais" name="pais" placeholder="Tu país" required>
                </div>
                
                <div class="form-group">
                    <label for="estado">Estado / Prov.</label>
                    <input type="text" id="estado" name="estado" placeholder="Tu estado" required>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="municipio">Municipio / Ciudad</label>
                <input type="text" id="municipio" name="municipio" placeholder="Tu municipio" required>
            </div>

            <div class="form-group full-width">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej. +1 234 567 890" required>
            </div>

            <!-- BOTON REGISTRATE CON TU ENLACE PATROCINADO -->
            <div class="submit-container">
                 <a href="https://www.profitableratecpmnetwork.com/qyuzwmmbm?key=3b0d02df84e8d62e5f125d8d748f952c"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn-submit-link">
                    Registrar
                 </a>
            </div>
        </form>

        <!-- 3. ANUNCIO EN EL PIE DE PÁGINA -->
        <div class="ad-space footer-ad">
            <script>
              atOptions = {
                'key' : '67facd5dae3141d3a5a72c7684741c7a',
                'format' : 'iframe',
                'height' : 60,
                'width' : 468,
                'params' : {}
              };
            </script>
            <script src="https://highrevenueformat.com"></script>
        </div>

    </div>

</body>
</html>
